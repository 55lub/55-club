<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>55 CLUB - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f2f2f2}
.top{background:#ff4d4d;color:white;padding:10px;text-align:center;font-weight:bold}
.wallet{background:white;margin:10px;border-radius:15px;padding:15px;text-align:center;box-shadow:0 2px 5px #0001}
.wallet h2{font-size:22px} .btns{display:flex;gap:10px;margin-top:10px}
.btns button{flex:1;padding:10px;border-radius:20px;border:none;color:white;font-weight:bold}
.b1{background:#ff4d4d} .b2{background:#ff8a5b}
.tabs{display:flex;gap:8px;padding:10px;overflow:auto}
.tabs div{background:white;padding:8px 12px;border-radius:10px;font-size:12px;white-space:nowrap}
.tabs .active{background:#ff4d4d;color:white}
.playbox{background:white;margin:10px;border-radius:15px;padding:12px}
.timer{display:flex;justify-content:space-between;align-items:center}
.timer b{font-size:20px;letter-spacing:2px;background:#eee;padding:5px 10px;border-radius:5px}
.colors{display:flex;gap:10px;margin:12px 0}
.colors button{flex:1;padding:10px;border:none;border-radius:8px;color:white;font-weight:bold}
.cG{background:#4caf50} .cV{background:#9c27b0} .cR{background:#f44336}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0}
.nums button{width:50px;height:50px;border-radius:50%;border:none;font-weight:bold;font-size:18px;color:white}
.betx{display:flex;gap:5px;margin:10px 0} .betx button{padding:8px 10px;border-radius:15px;border:1px solid #ddd;background:white;font-weight:bold}
.betx .a{background:#ff4d4d;color:white;border-color:#ff4d4d}
.bigsmall{display:flex;gap:10px} .bigsmall button{flex:1;padding:12px;border-radius:20px;border:none;font-weight:bold;color:white}
.history{background:white;margin:10px;border-radius:10px;padding:10px;font-size:12px}
.history table{width:100%;border-collapse:collapse} .history th{background:#ff4d4d;color:white;padding:6px}
.history td{padding:5px;text-align:center;border-bottom:1px solid #eee}
#registerPage,#loginPage{background:white;min-height:100vh;padding:20px}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ddd}
.regbtn{width:100%;padding:14px;background:#ff4d4d;border:none;border-radius:25px;color:white;font-weight:bold;margin-top:15px}
/* POPUP */
#popup{position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:999}
.popupBox{background:white;width:85%;max-width:300px;border-radius:20px;padding:20px;text-align:center}
.popupBox h2{margin-bottom:10px} .winC{color:#4caf50} .lossC{color:#f44336}
</style>
</head>
<body>

<div id="registerPage">
<h2 style="text-align:center;color:#ff4d4d">55 CLUB - Register</h2>
<input id="rPhone" placeholder="Phone number">
<input id="rPass" type="password" placeholder="Password">
<input id="rInvite" placeholder="Invite code">
<button class="regbtn" onclick="doReg()">Register</button>
<p style="text-align:center;margin-top:10px" onclick="showLogin()">Login</p>
</div>

<div id="loginPage" style="display:none">
<h2 style="text-align:center;color:#ff4d4d">55 CLUB - Login</h2>
<input id="lPhone" placeholder="Phone">
<input id="lPass" type="password" placeholder="Password">
<button class="regbtn" onclick="doLogin()">Log in</button>
<p style="text-align:center;margin-top:10px" onclick="showReg()">Register</p>
</div>

<div id="gamePage" style="display:none">
<div class="top">55CLUB - DEMO (Fake Points)</div>
<div class="wallet">
<h2>₹ <span id="bal">0.03</span></h2><small>Wallet balance - Demo</small>
<p id="myBet" style="margin-top:8px;font-weight:bold;color:#ff4d4d">Bet: -</p>
<p style="font-size:12px">Bet Amount: ₹<span id="betAmtShow">10</span></p>
<div class="btns">
<button class="b1" onclick="openDep()">Deposit (Demo)</button>
<button class="b2" onclick="alert('Demo ma Withdraw band che')">Withdraw</button>
</div>
</div>

<div class="tabs"><div class="active">WinGo 30sec</div><div>WinGo 1Min</div><div>WinGo 3Min</div><div>WinGo 5Min</div></div>

<div class="playbox">
<div class="timer"><span>WinGo 30sec <br><small id="pid">20260928...</small></span><span><small>Time remaining</small><br><b id="tm">00:30</b></span></div>
<div class="colors"><button class="cG" onclick="bet('Green')">Green</button><button class="cV" onclick="bet('Violet')">Violet</button><button class="cR" onclick="bet('Red')">Red</button></div>
<div class="nums">
<button style="background:#9c27b0" onclick="betNum(0)">0</button><button style="background:#4caf50" onclick="betNum(1)">1</button><button style="background:#f44336" onclick="betNum(2)">2</button><button style="background:#4caf50" onclick="betNum(3)">3</button><button style="background:#4caf50" onclick="betNum(4)">4</button>
<button style="background:#9c27b0" onclick="betNum(5)">5</button><button style="background:#f44336" onclick="betNum(6)">6</button><button style="background:#4caf50" onclick="betNum(7)">7</button><button style="background:#f44336" onclick="betNum(8)">8</button><button style="background:#4caf50" onclick="betNum(9)">9</button>
</div>
<div class="betx">
<button onclick="setAmt(10)" class="a" id="x1">X1 (10)</button>
<button onclick="setAmt(50)" id="x5">X5 (50)</button>
<button onclick="setAmt(100)" id="x10">X10 (100)</button>
<button onclick="setAmt(200)" id="x20">X20</button>
<button onclick="setAmt(500)" id="x50">X50</button>
<button onclick="setAmt(1000)" id="x100">X100</button>
</div>
<div class="bigsmall"><button style="background:orange" onclick="bet('Big')">Big</button><button style="background:#2196F3" onclick="bet('Small')">Small</button></div>
</div>

<div class="history">
<table><tr><th>Period</th><th>Number</th><th>Big Small</th><th>Color</th></tr><tbody id="hist"></tbody></table>
</div>

<div id="depBox" style="display:none;position:fixed;bottom:0;left:0;right:0;background:white;padding:20px;border-radius:20px 20px 0 0;box-shadow:0 -2px 10px #0003;z-index:100">
<h3>Demo Deposit</h3>
<p>UPI: <b>demo@okaxis</b></p>
<input id="depAmt" type="number" placeholder="Amount">
<input placeholder="UTR (kuch bhi likho)">
<button class="regbtn" onclick="addBal()">Submit (Fake Add)</button>
<button onclick="depBox.style.display='none'" style="width:100%;margin-top:10px">Close</button>
</div>

<!-- WIN LOSS POPUP -->
<div id="popup">
<div class="popupBox">
<h2 id="popTitle">WIN</h2>
<p id="popMsg"></p>
<p id="popBal" style="margin:10px 0;font-weight:bold"></p>
<button class="regbtn" onclick="closePop()">OK</button>
</div>
</div>

</div>

<script>
let bal=0.03; let time=30; let period=Date.now(); let betAmt=10; let curBet=null;

function showReg(){loginPage.style.display='none';registerPage.style.display='block'}
function showLogin(){registerPage.style.display='none';loginPage.style.display='block'}
function doReg(){localStorage.setItem("u_"+rPhone.value,rPass.value);alert("Register ok");lPhone.value=rPhone.value;showLogin()}
function doLogin(){let p=localStorage.getItem("u_"+lPhone.value); if(p&&p==lPass.value){registerPage.style.display='none';loginPage.style.display='none';gamePage.style.display='block'; start()}else alert("Pehle Register karo!")}
function openDep(){depBox.style.display='block'}
function addBal(){let a=parseFloat(depAmt.value)||0; bal+=a; document.getElementById('bal').innerText=bal.toFixed(2); depBox.style.display='none'; alert("Demo balance add ho gaya!")}
function setAmt(a){ betAmt=a; document.getElementById('betAmtShow').innerText=a; document.querySelectorAll('.betx button').forEach(b=>b.classList.remove('a')); event.target.classList.add('a'); }

function bet(c){
 if(time<=7){ alert("7 sec pehla betting band thai gayu! Next round ma lagavo"); return; }
 if(curBet){ alert("Ek bet lagi gayi che! Result pachi biji lagshe"); return; }
 if(bal<betAmt){ alert("Balance ochu che! Deposit karo"); return; }
 bal-=betAmt; curBet=c; 
 document.getElementById('bal').innerText=bal.toFixed(2);
 document.getElementById('myBet').innerText="Tari Bet: "+c+" | ₹"+betAmt;
}
function betNum(n){ bet("Num"+n) }

function closePop(){ document.getElementById('popup').style.display='none'; document.getElementById('myBet').innerText="Bet: -"; }

function start(){
 setInterval(()=>{
  time--; 
  if(time<0){
    time=30; 
    let winNum=Math.floor(Math.random()*10);
    let winCol= (winNum==0||winNum==5)?"Violet":(winNum%2==0?"Red":"Green");
    let winBS= winNum>=5?"Big":"Small";
    let row=`<tr><td>${period}</td><td>${winNum}</td><td>${winBS}</td><td>${winCol}</td></tr>`;
    hist.innerHTML=row+hist.innerHTML;
    
    if(curBet){
        let won=false;
        if(curBet==winCol) won=true;
        if(curBet==winBS) won=true;
        if(curBet=="Num"+winNum) won=true;
        // check color by number also
        if(curBet=="Green" && [1,3,7,9].includes(winNum)) won=true;
        if(curBet=="Red" && [2,4,6,8].includes(winNum)) won=true;
        if(curBet=="Violet" && [0,5].includes(winNum)) won=true;

        let popup=document.getElementById('popup');
        if(won){
            let winPrize = curBet.startsWith("Num") ? betAmt*9 : betAmt*2;
            bal+=winPrize;
            document.getElementById('popTitle').innerText="WINNER! 🎉";
            document.getElementById('popTitle').className="winC";
            document.getElementById('popMsg').innerText=`Result: ${winNum} ${winCol} ${winBS} | Tari Bet: ${curBet}`;
            document.getElementById('popBal').innerText=`+₹${winPrize} malya!`;
            popup.style.display='flex';
        } else {
            document.getElementById('popTitle').innerText="LOSS 😢";
            document.getElementById('popTitle').className="lossC";
            document.getElementById('popMsg').innerText=`Result: ${winNum} ${winCol} ${winBS} | Tari Bet: ${curBet}`;
            document.getElementById('popBal').innerText=`-₹${betAmt} gaya`;
            popup.style.display='flex';
        }
        document.getElementById('bal').innerText=bal.toFixed(2);
        curBet=null;
    }
    period++; 
  }
  tm.innerText="00:"+(time<10?"0"+time:time);
  pid.innerText=period;
  if(time==7 && curBet){ document.getElementById('myBet').innerText+=" - LOCKED"; }
 },1000);
}
</script>
</body>
 </html>
