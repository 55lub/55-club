<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>55 CLUB Demo Result</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f2f2f2}.top{background:#ff4d4d;color:white;padding:10px;text-align:center}
.wallet{background:white;margin:10px;border-radius:15px;padding:15px;text-align:center}
.b{padding:10px;border-radius:20px;border:none;color:white;flex:1}
.btns{display:flex;gap:10px;margin-top:10px}.b1{background:#ff4d4d}.b2{background:orange}
.playbox{background:white;margin:10px;border-radius:15px;padding:12px}
.betBtn{padding:12px;border:none;border-radius:10px;color:white;font-weight:bold;flex:1}
</style></head><body>
<div class="top">55CLUB DEMO - Fake Points</div>
<div class="wallet"><h2>₹ <span id="bal">100</span></h2><small>Demo Balance</small>
<p id="myBet" style="margin-top:8px;color:#ff4d4d;font-weight:bold">Bet: -</p>
<p id="res" style="font-weight:bold"></p>
</div>
<div class="playbox">
<div style="display:flex;justify-content:space-between"><span>Period: <b id="pid">1</b></span><b id="tm">00:30</b></div>
<div style="display:flex;gap:10px;margin:10px 0">
<button class="betBtn" style="background:#4caf50" onclick="placeBet('Green')">Green</button>
<button class="betBtn" style="background:#9c27b0" onclick="placeBet('Violet')">Violet</button>
<button class="betBtn" style="background:#f44336" onclick="placeBet('Red')">Red</button>
</div>
<div style="display:flex;gap:10px">
<button class="betBtn" style="background:orange" onclick="placeBet('Big')">Big</button>
<button class="betBtn" style="background:#2196F3" onclick="placeBet('Small')">Small</button>
</div>
<div id="nums" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px"></div>
</div>
<script>
let bal=100, curBet=null, time=30, period=1;
let numsDiv=document.getElementById('nums');
for(let i=0;i<=9;i++){ let b=document.createElement('button'); b.innerText=i; b.style.cssText="width:50px;height:50px;border-radius:50%;border:none;color:white;font-weight:bold;background:"+(i==0||i==5?"#9c27b0":(i%2==0?"#f44336":"#4caf50")); b.onclick=()=>placeBet('Num'+i); numsDiv.appendChild(b); }
function placeBet(t){ if(curBet){alert("Pela result aava do!");return} if(bal<10){alert("Demo balance khatam!");return} curBet=t; bal-=10; document.getElementById('bal').innerText=bal; document.getElementById('myBet').innerText="Tari Bet: "+t+" (10 Rs)"; }
setInterval(()=>{
time--; document.getElementById('tm').innerText="00:"+(time<10?"0"+time:time);
if(time<=0){ time=30; period++; document.getElementById('pid').innerText=period;
let winNum=Math.floor(Math.random()*10);
let winColor= winNum==0||winNum==5?"Violet":(winNum%2==0?"Red":"Green");
let winBS= winNum>=5?"Big":"Small";
let winMsg=`Result: ${winNum} | ${winColor} | ${winBS}`;
document.getElementById('res').innerText=winMsg;
// CHECK WIN
let won=false;
if(curBet){ if(curBet==winColor) won=true; if(curBet==winBS) won=true; if(curBet=="Num"+winNum) won=true; }
if(won){ bal+=20; document.getElementById('res').innerText=winMsg+" - YOU WIN +20"; }
else if(curBet){ document.getElementById('res').innerText=winMsg+" - YOU LOSS -10"; }
document.getElementById('bal').innerText=bal;
curBet=null; setTimeout(()=>{document.getElementById('myBet').innerText="Bet: -";},2000);
}
},1000);
</script></body></html>
