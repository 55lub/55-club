     <!-- FISHING SECTION - RIYAL VIDEO -->
<div id="fishingSection" class="gameSection" style="background:#000">
<div style="padding:10px;display:flex;justify-content:space-between;align-items:center;background:#0a1628">
<button onclick="backToHome()" style="padding:8px 14px;border:none;background:white;color:#000;border-radius:20px">← Back</button>
<span style="color:#00e5ff;font-weight:bold">🎣 Happy Fishing - REAL GAME</span>
<div style="color:gold">💰 ₹<span id="fishBal">0</span></div>
</div>

<!-- Taro j video - 100% riyal -->
<div style="position:relative;width:100%;height:calc(100vh - 110px);background:#000;overflow:hidden">
<video id="realFishVideo" autoplay muted loop playsinline controls
style="width:100%;height:100%;object-fit:contain;background:#000"
src="container:///mnt/data/unnamed">
</video>

<!-- Upar overlay - video ma jevu j UI -->
<div style="position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none">
<div style="background:rgba(0,0,0,0.7);color:white;padding:6px 12px;border-radius:20px;font-size:11px">💰 BAL: ₹<span id="fishBal2">0</span> | Bullet: ₹<span id="bulletCost">2</span></div>
<div style="background:rgba(255,0,0,0.7);color:white;padding:6px 12px;border-radius:20px;font-size:11px">🔴 LIVE - REAL</div>
</div>

<div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,0.9));padding:15px;display:flex;justify-content:space-around;align-items:center">
<button onclick="shootReal()" style="width:70px;height:70px;border-radius:50%;border:3px solid #ffeb3b;background:radial-gradient(#ff9800,#ff5722);color:white;font-weight:bold;font-size:22px;box-shadow:0 0 20px gold">🔫<br><span style="font-size:10px">FIRE</span></button>
<div style="text-align:center;color:white">
<div style="font-size:11px;color:#00e5ff">TAP FIRE TO SHOOT - Video jevi j</div>
<div style="font-size:10px;margin-top:4px"><span style="background:gold;color:black;padding:2px 6px;border-radius:10px">5X Super Prize</span> <span style="background:#9c27b0;color:white;padding:2px 6px;border-radius:10px">8X Turtle</span></div>
</div>
<button onclick="changeBullet()" style="padding:12px 15px;border-radius:20px;border:none;background:#00bcd4;color:white;font-weight:bold">₹<span id="bulletCost2">2</span><br><span style="font-size:9px">CHANGE</span></button>
</div>

<!-- Win popup like video -->
<div id="fishWinPopup" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(gold,orange);color:#000;padding:20px 30px;border-radius:20px;font-weight:bold;font-size:20px;display:none;z-index:10;box-shadow:0 0 30px gold;text-align:center;border:3px solid white">
<div>🎉 5X SUPER PRIZE 🎉</div>
<div id="fishWinAmt" style="font-size:28px">+₹50</div>
</div>
</div>
</div>
</div>

<script>
let bulletCost=2, fishWinTotal=0;
function openFishing(){
 document.getElementById('homePage').style.display='none';
 document.getElementById('gameTabs').style.display='none';
 document.querySelectorAll('.gameSection').forEach(el=>el.classList.remove('active'));
 document.getElementById('fishingSection').classList.add('active');
 document.getElementById('curLabel').innerText='FISHING REAL';
 let v=document.getElementById('realFishVideo');
 v.play().catch(()=>{});
 v.currentTime=5; // sidhu gameplay thi chalu
}
function shootReal(){
 if(bal < bulletCost){showToast("Low Balance! Deposit karo");return;}
 bal-=bulletCost;
 localStorage.setItem('bal_'+getCurrentUser(),bal.toString());
 document.getElementById('bal').innerText=bal.toFixed(2);
 document.getElementById('fishBal').innerText=bal.toFixed(2);
 document.getElementById('fishBal2').innerText=bal.toFixed(2);
 
 // Real win logic - video ma jem 5X, 8X ave
 let rand=Math.random();
 let win=0;
 if(rand<0.3){ // 30% win chance - video jevu
   let mult = rand<0.05 ? 5 : rand<0.15 ? 8 : 2; // 5X Super, 8X Turtle, 2X normal
   win = bulletCost * mult * (Math.floor(Math.random()*5)+1);
   bal+=win;
   fishWinTotal+=win;
   localStorage.setItem('bal_'+getCurrentUser(),bal.toString());
   document.getElementById('bal').innerText=bal.toFixed(2);
   document.getElementById('fishBal').innerText=bal.toFixed(2);
   document.getElementById('fishBal2').innerText=bal.toFixed(2);
   
   // Popup like video
   let popup=document.getElementById('fishWinPopup');
   document.getElementById('fishWinAmt').innerText='+₹'+win + (mult>=5 ? ' - '+mult+'X SUPER!' : '');
   popup.style.display='block';
   popup.style.animation='pop 0.5s';
   setTimeout(()=>{popup.style.display='none';},1500);
   
   if(mult>=5) showToast("🎉 "+mult+"X Super Prize! ₹"+win+" - Video jevo j!");
 }
}
function changeBullet(){let costs=[1,2,5,10,20];let idx=costs.indexOf(bulletCost);bulletCost=costs[(idx+1)%costs.length];document.getElementById('bulletCost').innerText=bulletCost;document.getElementById('bulletCost2').innerText=bulletCost;showToast("Bullet ₹"+bulletCost+" - Bada fish target kar!");}
 </script>                                                                                                                                                                                                                                                                                                                                                                 </html>
