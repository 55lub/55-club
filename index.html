function getRealUpi(){ return localStorage.getItem('adminRealUpi_322533')||""; }

function saveBothUpi(){

 let fake = document.getElementById('fakeUpiInput').value.trim();

 if(!fake.includes('@')){ alert("Fake UPI sahi nakh"); return; }

 localStorage.setItem('adminFakeUpi_322533', fake);

}

function renderRealAdminBox(){

      </div>`;

   document.getElementById('realAdminDepList').innerHTML=html||'<p style="color:gray;font-size:11px">Koi deposit nathi</p>';

function submitUTRFake(){
